name: CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    uses: SamuelMarks/c-ci/.github/workflows/c-cmake-ci.yml@master

  memory-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@master
      - name: Install dependencies
        run: DEBIAN_FRONTEND=noninteractive sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install -y valgrind clang cmake
      - name: Build with ASAN
        run: |
          mkdir build_asan && cd build_asan
          cmake .. -DCMAKE_C_COMPILER=gcc -DC_CDD_USE_ASAN=ON -DCMAKE_BUILD_TYPE=Debug -DCDD_DEPS=FETCHCONTENT
          make -j4
      - name: Run Tests with ASAN
        run: |
          cd build_asan
          ctest --output-on-failure
      - name: Build without ASAN for Valgrind
        run: |
          mkdir build_valgrind && cd build_valgrind
          cmake .. -DCMAKE_C_COMPILER=gcc -DC_CDD_USE_ASAN=OFF -DCMAKE_BUILD_TYPE=Debug -DCDD_DEPS=FETCHCONTENT
          make -j4
      - name: Run Tests with Valgrind
        run: |
          cd build_valgrind
          ctest -T memcheck --output-on-failure

  release-wasm:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@master
      - name: Install binaryen
        run: DEBIAN_FRONTEND=noninteractive sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install -y binaryen
      - name: Build WASM
        run: |
          git config --global core.autocrlf false
          make build_wasm
          cp bin/*.wasm . 2>/dev/null || cp build_wasm/bin/*.wasm . 2>/dev/null || cp build_wasm/*.wasm . 2>/dev/null
          if ! ls *.wasm 1> /dev/null 2>&1; then
            echo "Error: WASM artifact was not produced" >&2
            exit 1
          fi
          for f in *.wasm; do
            if [ -f "$f" ]; then
              wasm-opt -O3 "$f" -o "$f" || true
            fi
          done
      - name: Release Versioned WASM Artifact
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ github.ref_name }}
          files: "*.wasm"
          prerelease: false
          make_latest: true
