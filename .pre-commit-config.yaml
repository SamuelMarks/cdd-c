repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: mixed-line-ending
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v18.1.8
  hooks:
  - id: clang-format
    args:
    - -style=LLVM
    types_or:
    - c
    - c++
    exclude: src/test_cli_cli\.c$
- repo: local
  hooks:
  - id: cppcheck
    name: Cppcheck
    entry: python scripts/precommit_matrix.py cppcheck
    language: python
    pass_filenames: false
    types_or:
    - c
    - c++
  - id: compdb
    name: Build Compilation Database
    entry: python -c "import os, subprocess, sys; [os.environ.pop(k, None) for k in ['GIT_DIR', 'GIT_INDEX_FILE', 'GIT_WORK_TREE']]; sys.exit(subprocess.run(['cmake', '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON', '-S', '.', '-B', 'build']).returncode)"
    language: python
    pass_filenames: false
  - id: build-gcc
    name: Build (GCC)
    entry: python scripts/precommit_matrix.py build gcc
    language: python
    pass_filenames: false
  - id: test-gcc
    name: Test (GCC)
    entry: python scripts/precommit_matrix.py test gcc
    language: python
    pass_filenames: false
  - id: build-clang
    name: Build (Clang)
    entry: python scripts/precommit_matrix.py build clang
    language: python
    pass_filenames: false
  - id: test-clang
    name: Test (Clang)
    entry: python scripts/precommit_matrix.py test clang
    language: python
    pass_filenames: false
  - id: build-msvc
    name: Build (MSVC)
    entry: python scripts/precommit_matrix.py build msvc
    language: python
    pass_filenames: false
  - id: test-msvc
    name: Test (MSVC)
    entry: python scripts/precommit_matrix.py test msvc
    language: python
    pass_filenames: false
  - id: build-mingw
    name: Build (MinGW)
    entry: python scripts/precommit_matrix.py build mingw
    language: python
    pass_filenames: false
  - id: test-mingw
    name: Test (MinGW)
    entry: python scripts/precommit_matrix.py test mingw
    language: python
    pass_filenames: false
  - id: build-emscripten
    name: Build (Emscripten)
    entry: python scripts/precommit_matrix.py build emscripten
    language: python
    pass_filenames: false
  - id: test-emscripten
    name: Test (Emscripten)
    entry: python scripts/precommit_matrix.py test emscripten
    language: python
    pass_filenames: false
  - id: valgrind
    name: Valgrind (GCC)
    entry: python scripts/precommit_matrix.py valgrind gcc
    language: python
    pass_filenames: false
  - id: audit-error-percolator
    name: Audit Error Percolator
    entry: python scripts/precommit_matrix.py audit error_percolator
    language: python
    pass_filenames: false
  - id: check-enum-returns
    name: Check Enum Returns
    entry: python scripts/check_enum_returns_clang.py . --build-dir build --exclude-files "build*/*" --exclude-files "wasi-sdk/*" --exclude-files "test_bindings_out/*" --exclude-files "impl.c" --exclude-files "union_array_schema.json.c" --exclude-files "dummy_c_code.c" --exclude-files "*test_*dir*/*" --exclude-files "out_dir*/*" --exclude-files "out_dir/*" --exclude-files "out_server*/*" --exclude-files "out_server/*" --exclude-files "vcpkg/*" --exclude-files "vcpkg*/*" -- -Iinclude -Isrc -I../c-fs/include -I../../c-fs/include -I../c-str-span/include -I../../c-str-span/include -I../c89stringutils/include -I../../c89stringutils/include -I../parson -I../../parson -I../greatest -I../../greatest
    language: python
    additional_dependencies: [libclang]
    pass_filenames: false
  - id: check-no-discard-void-clang
    name: Check No-Discard Void Casts
    entry: python -c "import os, sys, urllib.request; p = next((x for x in ('/opt/homebrew/opt/llvm/lib/libclang.dylib', '/opt/homebrew/lib/libclang.dylib', '/usr/local/lib/libclang.dylib') if os.path.exists(x)), None); bdir = next((d for d in ('build', 'build_gcc') if os.path.exists(d + '/compile_commands.json')), None); args = [sys.argv[0]]; (args.extend(['--libclang-path', p]) if p and '--libclang-path' not in sys.argv else None); (args.extend(['--build-dir', bdir]) if bdir and '--build-dir' not in sys.argv else None); args.extend(sys.argv[1:]); sys.argv = args; src = open(os.path.expanduser('~/repos/c-ci/precommit_hooks/check_no_discard_void_clang.py')).read() if os.path.exists(os.path.expanduser('~/repos/c-ci/precommit_hooks/check_no_discard_void_clang.py')) else urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/refs/heads/master/precommit_hooks/check_no_discard_void_clang.py').read().decode('utf-8'); exec(src)"
    language: python
    additional_dependencies: [libclang]
    types: [c]
  - id: check-error-percolation-clang
    name: Check Error Percolation
    entry: python -c "import os, re, subprocess, sys, urllib.request; pending = set(re.findall(r'^- \[ \] `(src/[^`]+\.c)`', open('TODO_PLAN.md').read(), re.M)) if os.path.exists('TODO_PLAN.md') else set(); files = [f for f in sys.argv[1:] if f.startswith('src/') and f.endswith('.c') and f != 'src/tests/transformers/safe_crt/full_code.c' and f not in pending]; sys.exit(0) if not files else None; cargs = ['-DC_CDD_EXPORT=', '-DSIMPLE_MOCKS_EXPORT=', '-DCDD_SRC_MOCKS_EXPORT=', '-Iinclude', '-Isrc', '-Isrc/mocks', '-Isrc/tests']; [cargs.extend(['-I' + d]) for d in ('build', 'build/include', 'build/src', 'build/_deps/cfs-src/include', 'build/_deps/c_str_span-src', 'build/_deps/c89stringutils-src/c89stringutils', 'build/_deps/greatest-src') if os.path.exists(d)]; sdk = subprocess.check_output(['xcrun', '--show-sdk-path'], text=True).strip() if sys.platform == 'darwin' else ''; rdir = subprocess.check_output(['clang', '-print-resource-dir'], text=True).strip() if sys.platform == 'darwin' else ''; (cargs.append('--isysroot=' + sdk) if sdk else None); (cargs.append('-isystem' + rdir + '/include') if rdir else None); sys.argv = [sys.argv[0]] + files + ['--compile-args'] + cargs; hp = os.path.expanduser('~/repos/c-ci/precommit_hooks/check_error_percolation_clang.py'); src = open(hp).read() if os.path.exists(hp) else urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/refs/heads/master/precommit_hooks/check_error_percolation_clang.py').read().decode('utf-8'); exec(src)"
    language: python
    additional_dependencies: [libclang]
    types: [c]
  - id: check-az-span-casts
    name: Check az_span_create Casts
    entry: python scripts/check_az_span_casts.py
    language: python
    types_or:
    - c
    - c++
  - id: check-dogfooding
    name: Enforce Dogfooding of CLI, JSON, and Reflection
    entry: python scripts/check_dogfooding.py
    language: python
    types_or:
    - c
    - c++
  - id: update-shields
    name: Update README Shields
    entry: python scripts/precommit_matrix.py shields
    language: python
    additional_dependencies:
    - gcovr
    pass_filenames: false
    always_run: true
