repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: mixed-line-ending
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v18.1.8
  hooks:
  - id: clang-format
    args:
    - -style=LLVM
    types_or:
    - c
    - c++
    exclude: src/test_cli_cli\.c$
- repo: local
  hooks:
  - id: cppcheck
    name: Cppcheck
    entry: python -c "import os, urllib.request; p = 'scripts/precommit_matrix.py'; p2 = os.path.expanduser('~/repos/c-ci/precommit_matrix.py'); src = open(p).read() if os.path.exists(p) else (open(p2).read() if os.path.exists(p2) else urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read().decode('utf-8')); exec(src)"
      cppcheck
    language: python
    pass_filenames: false
    types_or:
    - c
    - c++
  - id: compdb
    name: Build Compilation Database
    entry: python -c "import os, subprocess, sys; [os.environ.pop(k, None) for k in ['GIT_DIR', 'GIT_INDEX_FILE', 'GIT_WORK_TREE']]; sys.exit(subprocess.run(['cmake', '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON', '-S', '.', '-B', 'build']).returncode)"
    language: python
    pass_filenames: false
  - id: build-gcc
    name: Build (GCC)
    entry: python -c "import os, urllib.request; p = 'scripts/precommit_matrix.py'; p2 = os.path.expanduser('~/repos/c-ci/precommit_matrix.py'); src = open(p).read() if os.path.exists(p) else (open(p2).read() if os.path.exists(p2) else urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read().decode('utf-8')); exec(src)"
      build gcc
    language: python
    pass_filenames: false
  - id: test-gcc
    name: Test (GCC)
    entry: python -c "import os, urllib.request; p = 'scripts/precommit_matrix.py'; p2 = os.path.expanduser('~/repos/c-ci/precommit_matrix.py'); src = open(p).read() if os.path.exists(p) else (open(p2).read() if os.path.exists(p2) else urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read().decode('utf-8')); exec(src)"
      test gcc
    language: python
    pass_filenames: false
  - id: build-clang
    name: Build (Clang)
    entry: python -c "import os, urllib.request; p = 'scripts/precommit_matrix.py'; p2 = os.path.expanduser('~/repos/c-ci/precommit_matrix.py'); src = open(p).read() if os.path.exists(p) else (open(p2).read() if os.path.exists(p2) else urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read().decode('utf-8')); exec(src)"
      build clang
    language: python
    pass_filenames: false
  - id: test-clang
    name: Test (Clang)
    entry: python -c "import os, urllib.request; p = 'scripts/precommit_matrix.py'; p2 = os.path.expanduser('~/repos/c-ci/precommit_matrix.py'); src = open(p).read() if os.path.exists(p) else (open(p2).read() if os.path.exists(p2) else urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read().decode('utf-8')); exec(src)"
      test clang
    language: python
    pass_filenames: false
  - id: build-msvc
    name: Build (MSVC)
    entry: python -c "import os, urllib.request; p = 'scripts/precommit_matrix.py'; p2 = os.path.expanduser('~/repos/c-ci/precommit_matrix.py'); src = open(p).read() if os.path.exists(p) else (open(p2).read() if os.path.exists(p2) else urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read().decode('utf-8')); exec(src)"
      build msvc
    language: python
    pass_filenames: false
  - id: test-msvc
    name: Test (MSVC)
    entry: python -c "import os, urllib.request; p = 'scripts/precommit_matrix.py'; p2 = os.path.expanduser('~/repos/c-ci/precommit_matrix.py'); src = open(p).read() if os.path.exists(p) else (open(p2).read() if os.path.exists(p2) else urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read().decode('utf-8')); exec(src)"
      test msvc
    language: python
    pass_filenames: false
  - id: build-mingw
    name: Build (MinGW)
    entry: python -c "import os, urllib.request; p = 'scripts/precommit_matrix.py'; p2 = os.path.expanduser('~/repos/c-ci/precommit_matrix.py'); src = open(p).read() if os.path.exists(p) else (open(p2).read() if os.path.exists(p2) else urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read().decode('utf-8')); exec(src)"
      build mingw
    language: python
    pass_filenames: false
  - id: test-mingw
    name: Test (MinGW)
    entry: python -c "import os, urllib.request; p = 'scripts/precommit_matrix.py'; p2 = os.path.expanduser('~/repos/c-ci/precommit_matrix.py'); src = open(p).read() if os.path.exists(p) else (open(p2).read() if os.path.exists(p2) else urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read().decode('utf-8')); exec(src)"
      test mingw
    language: python
    pass_filenames: false
  - id: build-emscripten
    name: Build (Emscripten)
    entry: python -c "import os, urllib.request; p = 'scripts/precommit_matrix.py'; p2 = os.path.expanduser('~/repos/c-ci/precommit_matrix.py'); src = open(p).read() if os.path.exists(p) else (open(p2).read() if os.path.exists(p2) else urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read().decode('utf-8')); exec(src)"
      build emscripten
    language: python
    pass_filenames: false
  - id: test-emscripten
    name: Test (Emscripten)
    entry: python -c "import os, urllib.request; p = 'scripts/precommit_matrix.py'; p2 = os.path.expanduser('~/repos/c-ci/precommit_matrix.py'); src = open(p).read() if os.path.exists(p) else (open(p2).read() if os.path.exists(p2) else urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read().decode('utf-8')); exec(src)"
      test emscripten
    language: python
    pass_filenames: false
  - id: valgrind
    name: Valgrind (GCC)
    entry: python -c "import os, urllib.request; p = 'scripts/precommit_matrix.py'; p2 = os.path.expanduser('~/repos/c-ci/precommit_matrix.py'); src = open(p).read() if os.path.exists(p) else (open(p2).read() if os.path.exists(p2) else urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read().decode('utf-8')); exec(src)"
      valgrind gcc
    language: python
    pass_filenames: false
  - id: audit-error-percolator
    name: Audit Error Percolator
    entry: python -c "import os, urllib.request; p = 'scripts/precommit_matrix.py'; p2 = os.path.expanduser('~/repos/c-ci/precommit_matrix.py'); src = open(p).read() if os.path.exists(p) else (open(p2).read() if os.path.exists(p2) else urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read().decode('utf-8')); exec(src)"
      audit error_percolator
    language: python
    pass_filenames: false
  - id: check-enum-returns
    name: Check Enum Returns
    entry: python scripts/check_enum_returns_clang.py . --build-dir build --exclude-files "build*/*" --exclude-files "test_bindings_out/*" --exclude-files "impl.c" --exclude-files "union_array_schema.json.c" --exclude-files "dummy_c_code.c" --exclude-files "*test_*dir*/*" --exclude-files "out_dir*/*" --exclude-files "out_dir/*" --exclude-files "out_server*/*" --exclude-files "out_server/*" --exclude-files "vcpkg/*" --exclude-files "vcpkg*/*" -- -Iinclude -Isrc -I../c-fs/include -I../c-str-span/include -I../c89stringutils/include -I../parson -I../greatest
    language: python
    additional_dependencies: [libclang]
    pass_filenames: false
  - id: check-no-discard-void-clang
    name: Check No-Discard Void Casts
    entry: python -c "import os, sys, urllib.request; p = next((x for x in ('/opt/homebrew/opt/llvm/lib/libclang.dylib', '/opt/homebrew/lib/libclang.dylib', '/usr/local/lib/libclang.dylib') if os.path.exists(x)), None); bdir = next((d for d in ('build', 'build_gcc') if os.path.exists(d + '/compile_commands.json')), None); args = [sys.argv[0]]; (args.extend(['--libclang-path', p]) if p and '--libclang-path' not in sys.argv else None); (args.extend(['--build-dir', bdir]) if bdir and '--build-dir' not in sys.argv else None); args.extend(sys.argv[1:]); sys.argv = args; src = open(os.path.expanduser('~/repos/c-ci/precommit_hooks/check_no_discard_void_clang.py')).read() if os.path.exists(os.path.expanduser('~/repos/c-ci/precommit_hooks/check_no_discard_void_clang.py')) else urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/refs/heads/master/precommit_hooks/check_no_discard_void_clang.py').read().decode('utf-8'); exec(src)"
    language: python
    additional_dependencies: [libclang]
    types: [c]
  - id: update-shields
    name: Update README Shields
    entry: python -c "import os, urllib.request; p = 'scripts/precommit_matrix.py'; p2 = os.path.expanduser('~/repos/c-ci/precommit_matrix.py'); src = open(p).read() if os.path.exists(p) else (open(p2).read() if os.path.exists(p2) else urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read().decode('utf-8')); exec(src)"
      shields
    language: python
    additional_dependencies:
    - gcovr
    pass_filenames: false
    always_run: true
